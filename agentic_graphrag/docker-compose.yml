# Production backends for Stage 2 (graph construction).
#   docker compose up -d
#   export NEO4J_PASSWORD=graphrag-dev   # must match NEO4J_AUTH below
#   construct --json document.json --metadata metadata.json \
#             --graph-backend neo4j --vector-backend qdrant
# Tests never need these: they use the in-memory stores.
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: graphrag-neo4j
    ports:
      - "7474:7474"   # browser
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-graphrag-dev}"
      NEO4J_server_memory_heap_max__size: "1G"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.19.0   # keep within one minor version of qdrant-client
    container_name: graphrag-qdrant
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  neo4j-data:
  qdrant-data:
