# Stage 1 extraction configuration. Generated by scripts/generate_config.py;
# every value below is the documented default unless noted in the header.
# Provider overrides for this repo: Azure OpenAI chat (deployment from $AZURE_OPENAI_DEPLOYMENT)
# and OpenRouter embeddings. Code defaults are Anthropic + sentence-transformers.
llm:
  # Chat/vision LLM provider.
  provider: azure_openai
  # Model id (Anthropic/OpenRouter) or deployment name (Azure). For azure_openai an empty value falls back to $AZURE_OPENAI_DEPLOYMENT.
  model: ''
  # Max output tokens per call.
  max_tokens: 4096
  # Anthropic output_config.effort for extraction calls.
  effort: medium
  # Send server-side refusal fallbacks ('default') on Anthropic calls.
  anthropic_fallbacks: true
  # Sampling temperature for OpenAI-compatible providers (None = omit).
  temperature: 0.0
  # Retries on transient/invalid-JSON errors.
  max_retries: 3
  # Exponential backoff base (s).
  backoff_base_s: 1.0
  # Backoff cap (s).
  backoff_max_s: 30.0
  # Per-request timeout (s).
  timeout_s: 120.0

embedder:
  # Embedding backend.
  provider: openrouter
  # Embedding model.
  model: liquid/lfm-2.5-embedding-350m:free
  batch_size: 32
  # Dimension of the deterministic FakeEmbedder.
  fake_dim: 256
  # Retries on rate limits / transient errors.
  max_retries: 6
  # Exponential backoff base (s).
  backoff_base_s: 2.0
  # Backoff cap (s); free tiers reset per minute.
  backoff_max_s: 60.0

ocr:
  # OCR engine.
  engine: tesseract
  # Tesseract language code(s).
  language: eng
  # DPI used to rasterise scanned PDF pages.
  render_dpi: 300

router:
  # Larger files are inaccessible.
  max_file_size_mb: 200.0
  # PDF pages with fewer native characters are treated as scanned.
  min_native_text_chars: 25

classification:
  # τ: minimum cosine Conf(C) to accept the argmax class; below → Unknown.
  tau: 0.2
  # Prototype text embedded for each of the 12 document classes.
  class_descriptions:
    Standard Operating Procedure (SOP): standard operating procedure sop purpose scope responsibilities procedure steps shall must approval revision compliance work instruction
    User Manual: user manual guide how to use features getting started controls interface operation instructions troubleshooting faq user
    Technical Report: technical report analysis results evaluation methodology system design architecture performance findings conclusion engineering
    Installation Guide: installation guide install setup prerequisites requirements configure deploy download package dependencies version step
    Maintenance Manual: maintenance manual inspection service schedule replace lubricate repair parts preventive maintenance interval torque
    Machine Log / System Log: log timestamp error warning info debug event system machine process status code trace message
    Incident Report: incident report occurred root cause impact timeline corrective action investigation severity outage injury
    Test Report: test report test case pass fail result expected actual verification validation coverage defect test plan
    Research Document: abstract introduction related work method experiments results discussion conclusion references paper research study hypothesis
    Policy or Compliance Document: policy compliance regulation must shall governance requirements audit controls obligations legal privacy security
    Invoice / Form: invoice form bill amount total tax date due payment quantity price customer signature field
    Miscellaneous: document general information notes miscellaneous content
  # Text budget for the feature text.
  max_feature_chars: 4000

ocr_quality:
  # τ_quality: Q_i ≥ τ → VALID.
  tau_quality: 0.6
  # w_k for each normalised metric m_k (renormalised to sum 1).
  weights:
    resolution: 0.1
    brightness: 0.08
    contrast: 0.12
    sharpness: 0.15
    noise: 0.1
    blur: 0.1
    skew: 0.07
    rotation: 0.05
    compression: 0.03
    ocr_confidence: 0.2
  # Shorter side at which resolution m=1.
  target_min_side_px: 1600
  # Laplacian variance (of the pre-smoothed page) at which m=1.
  sharpness_ref: 50.0
  # Paper-minus-ink mean grey level at which m=1.
  contrast_ref: 120.0
  # Ideal mean grey level of a page.
  target_brightness: 200.0
  # Residual noise sigma at which m=0.
  noise_ref: 12.0
  # High-frequency energy ratio at which m=1.
  blur_ref: 0.12
  # Skew at which m=0.
  max_skew_deg: 10.0
  # 8x8 blockiness at which m=0.
  compression_ref: 8.0
  # Mean grey below → low illumination.
  low_illumination_mean: 90.0

enhancement:
  # Denoise when noise metric m < this.
  noise_threshold: 0.6
  # Sharpen when sharpness/blur m < this.
  blur_threshold: 0.5
  # Enhance contrast when m < this.
  contrast_threshold: 0.5
  # Deskew when |skew| > this.
  skew_threshold_deg: 0.5
  # Super-resolve when the shorter side < this.
  min_side_px: 1000
  # Pluggable super-resolution backend.
  super_resolution: bicubic
  # Path to an OpenCV dnn_superres model (opencv_dnn backend).
  super_resolution_model: null
  super_resolution_scale: 2

layout:
  # Layout model behind the LayoutModel interface.
  backend: heuristic
  # Top fraction = header zone.
  header_band: 0.07
  # Bottom fraction = footer zone.
  footer_band: 0.07
  # Font ratio vs body → heading.
  heading_size_ratio: 1.12
  # Font ratio vs body → title.
  title_size_ratio: 1.45
  # Width ratio → full-width.
  full_width_ratio: 0.6
  # IoU → overlapping.
  overlap_iou_threshold: 0.3
  # Max caption↔object vertical gap as fraction of page height.
  caption_max_gap_ratio: 0.12
  # Min gap = whitespace.
  whitespace_min_gap_ratio: 0.03

context_memory:
  # ContextLimit in tokens (Alg. 9).
  context_limit: 1500
  # Hard upper bound per chunk.
  max_chunk_tokens: 400
  # No semantic break before this size.
  min_chunk_tokens: 60
  # Start a new chunk when sim(unit, chunk) < this.
  semantic_break_threshold: 0.15
  # Add a semantic edge when cos ≥ this.
  link_threshold: 0.45
  # Use the LLM for chunk summaries.
  llm_chunk_summaries: false

table:
  # Empty-cell tolerance.
  max_missing_cell_ratio: 0.3

figure:
  # Send the figure crop to a vision LLM.
  use_vision: true

entity:
  # Classify/describe NER candidates with the LLM.
  use_llm: true
  # Candidates sent to the LLM per section.
  max_candidates: 60

abbreviation:
  max_abbr_len: 10

summarization:
  # Length constraint.
  max_summary_words: 160
  # Sentences kept by semantic ranking.
  key_sentences: 5
  # sim(summary, section) floor.
  min_context_similarity: 0.35
  # Completeness floor.
  min_keyword_coverage: 0.2
  # Drop near-duplicate sentences.
  redundancy_similarity: 0.95

hallucination:
  # τ: HScore ≤ τ → Verified.
  tau: 0.65
  # Bounded regeneration retries.
  max_regenerations: 2
  # A generated sentence below this max-sim to the source is unsupported.
  unsupported_sentence_similarity: 0.2

confidence:
  # w_k per agent; renormalised over the scores present for each object.
  weights:
    ocr_quality: 0.1
    layout: 0.1
    section_identification: 0.1
    table: 0.1
    figure: 0.1
    equation: 0.1
    entity: 0.1
    summarization: 0.15
    hallucination: 0.15
    classification: 0.0
    abbreviation: 0.0
  # C ≥ this → High.
  high_threshold: 0.8
  # C ≥ this → Medium.
  medium_threshold: 0.5
  # Scores that must be present for a section (missing → validation fails).
  required_components: [layout, section_identification, summarization]

global_validation:
  # w_i for each validation category q_i in Q = Σ w_i q_i.
  weights:
    document_integrity: 0.25
    extracted_objects: 0.25
    metadata_consistency: 0.2
    json_schema: 0.15
    cross_document_consistency: 0.15
  # Q ≥ this (and no errors).
  approve_threshold: 0.8

paths:
  # Where M, J and the report are written.
  output_dir: output
  # ReviewQueue JSONL.
  review_queue: output/review_queue.jsonl
  # Published schemas.
  schemas_dir: schemas

log_level: INFO

